# Deploy the control plane to the VM.
#
# MANUALLY DISPATCHED, NOT PUSH-TRIGGERED. A publicly attackable service that
# redeploys itself on every commit to main has no stable state to attack, and
# no moment where a human decided the release was ready. Releases are a
# decision here, and rollback is one too.
#
# REPEATABLE, AND NOTHING IS EDITED ON THE VM. The whole release is an image
# digest and an environment file the workflow writes. Nobody SSHes in to change
# a line, which is the failure mode this workflow exists to prevent.
#
# ROLLBACK IS BY DIGEST, NOT BY TAG. Every release records the digest it
# replaced in `infra/.previous-image` on the VM. Rolling back re-pins that
# digest and brings the stack back up — `latest` is not a version and a tag can
# move under you.
name: Deploy API

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA or branch to deploy'
        required: true
        default: 'main'
      rollback:
        description: 'Roll back to the previously deployed image instead of deploying'
        type: boolean
        default: false

concurrency:
  # Two overlapping deploys would race on the compose project and on the
  # migration container. One at a time, and never cancelled mid-flight.
  group: deploy-api
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/control-plane-api

jobs:
  publish:
    name: Publish image
    if: ${{ !inputs.rollback }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          build-args: APP_VERSION=${{ inputs.ref }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the VM
    needs: [publish]
    # `always()` so a rollback run, which skips `publish`, still reaches here.
    if: ${{ always() && (inputs.rollback || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      # OIDC. The runner mints a short-lived identity token that GCP's Workload
      # Identity Federation trades for a federated access token scoped to the
      # deployment service account. There is no service-account JSON key in this
      # repository, in GitHub, or on the runner — the credential is minted per
      # run and expires with it, so there is nothing to leak or rotate.
      id-token: write
      # Lets THIS job's automatic GITHUB_TOKEN pull the private image, which is
      # what removes the need for a long-lived registry PAT. See the Release
      # step for why that is the better credential.
      packages: read
    env:
      # Deliberately literal, not secrets and not variables.
      #
      # None of these is sensitive: a project id, a project number, a zone and
      # an instance name identify infrastructure, they do not authorise anything.
      # What authorises is the federation trust policy on the provider below,
      # which is bound by attribute condition to THIS repository — so publishing
      # the provider's resource name grants a reader nothing.
      #
      # Written here rather than in `vars` so the deployment is reproducible from
      # the repository alone: a workflow whose target lives only in a GitHub
      # settings page cannot be reviewed in a pull request, and this repository
      # is itself an exhibit.
      GCP_PROJECT: engineering-portfolio-prod
      GCP_ZONE: europe-west2-a
      GCP_VM: portfolio-live-prod-01
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve the image to deploy
        id: image
        run: |
          if [ "${{ inputs.rollback }}" = "true" ]; then
            echo "mode=rollback" >> "$GITHUB_OUTPUT"
          else
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.publish.outputs.digest }}" >> "$GITHUB_OUTPUT"
          fi

      # WHY FEDERATION AND NOT AN SSH KEY
      #
      # The VM has no public SSH port and uses OS Login, so a private key in a
      # GitHub secret could not reach it and would not be honoured if it did:
      # OS Login ignores metadata keys, and the login name is derived from the
      # Google identity rather than chosen. Federating instead removes the
      # long-lived credential entirely — this job holds nothing that outlives it.
      - name: Authenticate to GCP with GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          project_id: engineering-portfolio-prod
          workload_identity_provider: projects/328778272589/locations/global/workloadIdentityPools/github-actions/providers/github
          # The DEPLOYMENT identity, deliberately not the VM's runtime identity.
          # It can open an IAP tunnel and log in to this one instance; it cannot
          # read application data, and nothing it holds outlives the job.
          service_account: portfolio-deployer@engineering-portfolio-prod.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # WHERE HOST VERIFICATION WENT
      #
      # The old path pinned a host key because raw SSH over the internet has no
      # other anchor. This path has a stronger one: IAP authenticates the tunnel
      # to a named instance in a named project before any SSH bytes flow, and
      # authorisation is an IAM decision. gcloud manages the host key for that
      # instance itself. The trust anchor moved from a pinned string in a GitHub
      # secret to Google's own authenticated channel; it was not removed.
      - name: Ship the compose files
        run: |
          gcloud compute ssh "$GCP_VM" \
            --zone "$GCP_ZONE" --project "$GCP_PROJECT" \
            --tunnel-through-iap --quiet \
            --command 'mkdir -p ~/control-plane/infra'
          gcloud compute scp \
            --zone "$GCP_ZONE" --project "$GCP_PROJECT" \
            --tunnel-through-iap --quiet \
            infra/compose.yml infra/Caddyfile infra/otel-collector.yaml \
            "$GCP_VM:~/control-plane/infra/"

      - name: Write the environment file
        # Secrets never enter git and never enter the image; they are written
        # here, over SSH, at release time. `set +x` and a quoted heredoc keep
        # them out of the workflow log.
        run: |
          set +x
          cat > /tmp/env.deploy <<EOF
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=control_plane
          APP_DB_PASSWORD=${{ secrets.APP_DB_PASSWORD }}
          IP_HASH_PEPPER=${{ secrets.IP_HASH_PEPPER }}
          ADMIN_TOKEN=${{ secrets.ADMIN_TOKEN }}
          PAYMENT_WEBHOOK_SECRET=${{ secrets.PAYMENT_WEBHOOK_SECRET }}
          RECEIPT_SIGNING_KEY=${{ secrets.RECEIPT_SIGNING_KEY }}
          CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          LOG_LEVEL=info
          TENANT_TTL_SECONDS=${{ vars.TENANT_TTL_SECONDS || '1800' }}
          PURGE_INTERVAL_MS=${{ vars.PURGE_INTERVAL_MS || '15000' }}
          OTEL_ENABLED=true
          APP_VERSION=${{ inputs.ref }}
          EOF
          gcloud compute scp \
            --zone "$GCP_ZONE" --project "$GCP_PROJECT" \
            --tunnel-through-iap --quiet \
            /tmp/env.deploy "$GCP_VM:~/control-plane/infra/.env.partial"
          rm -f /tmp/env.deploy

      - name: Release
        # The release script travels over the IAP tunnel on STDIN, never as
        # command arguments — so nothing in it is visible in `ps` on the VM or
        # in gcloud's own argument logging. That matters because the registry
        # credential below is inside it.
        #
        # STDIN IS GUARDED, BECAUSE ITS FAILURE MODE IS SILENT SUCCESS.
        # If gcloud ever stopped forwarding stdin, `bash -s` would read EOF, do
        # nothing, and exit 0 — a deploy that reported success while shipping
        # nothing at all. So the script prints a marker as its last act and this
        # step fails if the marker never arrives. `tee` keeps the remote output
        # streaming into the log rather than being swallowed for the check, and
        # `pipefail` keeps gcloud's own exit code authoritative.
        run: |
          set -euo pipefail
          gcloud compute ssh "$GCP_VM" \
            --zone "$GCP_ZONE" --project "$GCP_PROJECT" \
            --tunnel-through-iap --quiet \
            --command "MODE='${{ steps.image.outputs.mode }}' NEW_IMAGE='${{ steps.image.outputs.ref }}' bash -s" <<'REMOTE' | tee /tmp/release.log
          set -euo pipefail
          cd ~/control-plane/infra

          # The registry credential is read-only, lives only in this shell, and
          # is revoked from the host on exit by whichever path exits — success,
          # failure, or interruption. It is never written to .env, so the
          # long-lived application environment on the VM cannot carry it.
          cleanup() { sudo docker logout ghcr.io >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          if [ "$MODE" = "rollback" ]; then
            if [ ! -f .previous-image ]; then
              echo "::error::no previous image recorded on this host — nothing to roll back to"
              exit 1
            fi
            TARGET="$(cat .previous-image)"
            echo "rolling back to $TARGET"
          else
            TARGET="$NEW_IMAGE"
            # Record what we are replacing BEFORE replacing it, so a failed
            # release can be undone even if this script dies halfway.
            if [ -f .env ] && grep -q '^API_IMAGE=' .env; then
              grep '^API_IMAGE=' .env | cut -d= -f2- > .previous-image
            fi
          fi

          # Compose the final env file: the secrets just shipped, plus the image
          # pin. Written atomically so a killed deploy cannot leave a half file.
          cp .env.partial .env.next
          echo "API_IMAGE=$TARGET" >> .env.next
          mv .env.next .env
          rm -f .env.partial
          chmod 600 .env

          # The package is PRIVATE and stays private: the control plane's image
          # is the deployable artifact of a system that invites attack, and
          # publishing it to save one login would be trading a real boundary for
          # a convenience.
          #
          # WHY GITHUB_TOKEN AND NOT A PAT.
          # This job's automatic token already has `packages: read`, it is minted
          # for this run, and it dies with it. A personal access token would be a
          # long-lived credential a human has to create, store, remember to scope
          # and remember to rotate — strictly more to go wrong for exactly the
          # same pull. The best secret is the one that does not need to exist.
          #
          # --password-stdin keeps it off the argument list; the value itself
          # arrived on this script's stdin, so it is never in `ps` either.
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' \
            | sudo docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          sudo docker compose --env-file .env -f compose.yml pull
          # Revoked immediately: the pull is the only thing that needed it, and
          # the trap above is the backstop rather than the mechanism.
          sudo docker logout ghcr.io

          # `up -d` recreates only what changed. The migrate container runs to
          # completion first (service_completed_successfully), so a bad
          # migration stops the release before the API serves a request.
          sudo docker compose --env-file .env -f compose.yml up -d --remove-orphans

          echo "waiting for readiness"
          ok=0
          for i in $(seq 1 30); do
            if sudo docker compose --env-file .env -f compose.yml exec -T api \
                 node -e "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              ok=1; break
            fi
            sleep 5
          done

          if [ "$ok" != "1" ]; then
            echo "::error::the release did not become ready"
            if [ -f .previous-image ] && [ "$MODE" != "rollback" ]; then
              echo "rolling back automatically to $(cat .previous-image)"
              sed -i "s|^API_IMAGE=.*|API_IMAGE=$(cat .previous-image)|" .env
              sudo docker compose --env-file .env -f compose.yml up -d
            fi
            exit 1
          fi

          echo "$TARGET" > .current-image
          sudo docker image prune -f --filter "until=168h" || true
          echo "released $TARGET"
          # Last line of the script, deliberately. Its absence upstream means
          # the script did not run to completion — or did not run at all.
          echo "__RELEASE_SCRIPT_COMPLETED__"
          REMOTE

          if ! grep -q '__RELEASE_SCRIPT_COMPLETED__' /tmp/release.log; then
            echo "::error::the release script did not run to completion on the VM."
            echo "::error::gcloud exited 0 but the remote marker never arrived, which"
            echo "::error::means stdin did not reach 'bash -s'. NOTHING WAS DEPLOYED."
            exit 1
          fi
          rm -f /tmp/release.log

      - name: Confirm the tunnel is serving the new version
        # Readiness inside the container proves the container. Only a request
        # through Cloudflare proves the deployment is reachable — CI proving the
        # artifact and the network proving it reachable are different claims.
        run: |
          for i in $(seq 1 20); do
            body=$(curl -fsS "${{ vars.API_PUBLIC_URL }}/health" || true)
            if [ -n "$body" ]; then echo "$body"; exit 0; fi
            sleep 6
          done
          echo "::error::the deployed API did not answer through Cloudflare"
          exit 1
