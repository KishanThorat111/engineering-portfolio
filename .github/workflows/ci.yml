# CI truth gates — blueprint §7.5.
#
# Every push to main passes these gates before it can deploy. The gates encode
# the Truth Constitution rather than promising it: the copy gate greps BUILT
# output — the pages people read and the artifacts machines read — for banned
# identity and hype words (Ruling 1, §3.4), the link gate makes dead internal
# links a build failure, and the dependency audit applies the lesson this
# portfolio publishes: known CVEs must never reach main silently.
#
# The gates run at the repository root against the composed `dist/` that every
# workspace builds into, so they keep covering the whole deployed surface as
# surfaces are added rather than needing one copy per workspace.
#
# Lighthouse runs warn-only until Phase 8 hardening flips it to enforcing.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    name: Build & truth gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      # `npm audit --omit=dev --audit-level=high`, unchanged in strictness, plus
      # checked exceptions for advisories with no fix that cannot be reached:
      # each one's conditions are re-verified on every run and it fails the
      # moment a fix ships or the code becomes reachable. See
      # scripts/audit-check.mjs and docs/PHASE_LOG.md (S8).
      - name: Dependency audit (production, high+)
        run: npm run audit:prod

      # Formatting was verified by hand before every commit until now, which
      # means it was verified by memory. It is deterministic and cheap, so it
      # belongs here rather than in a habit.
      - name: Formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Copy gate — banned words against built HTML
        run: npm run gate:copy

      - name: Internal link check
        run: npm run gate:links

      - name: HTML validation
        run: npm run gate:html

      - name: Token contrast (WCAG 2.2 AA)
        run: npm run gate:contrast

      - name: Confidential-content parity against the CV
        run: npm run gate:confidential

      - name: Machine/human parity — profile.json against the pages
        run: npm run gate:machine

      # The two surfaces now share an origin, so the risk is the one rule 10
      # exists to catch: each telling a reader something different. This reads
      # the built artifact and needs no browser, so it belongs beside the other
      # truth gates rather than in the local-only render harness.
      - name: Fast lane and machine layer reconciled
        run: npm run gate:fastlane

      # The gate that would have caught the ten-station world shipping on every
      # route. Every other gate here asks whether what shipped is TRUE; this one
      # asks WHERE it shipped. It verifies the home page's station/plate mapping
      # and its locked hero content, and that no other built page carries the
      # world in its markup or in any stylesheet it links.
      #
      # It was added to package.json's `verify` chain but not here, so it ran
      # locally and never in CI — which is the same as not having it, for the
      # regression it exists to prevent.
      - name: Station mapping, locked hero, and the world stays on /
        run: npm run gate:stations

      # B-202. The effective Content-Security-Policy each surface receives once
      # Cloudflare has composed every matching _headers rule — the thing that
      # broke /live/ twice in August 2026 while every check here was green. It
      # re-applies both historical defects on every run and requires a failure
      # for each, so it cannot pass vacuously.
      - name: B-202 — effective security policy per surface
        run: npm run gate:policy

      # B-203. The committed release script, run under `bash -s` as the deploy
      # runs it, must reach its completion marker; with the 3ed473e redirect
      # removed it must not. Nothing touches a VM.
      - name: B-203 — the release script runs to completion
        run: npm run gate:release

      # /live/ has no control plane behind it by design. This proves, in the
      # runner's Chrome, that it is RECORDED from the first frame, never calls
      # /v1/*, shows no control that cannot work, plays all five recorded
      # demonstrations, renders all three investigations, and has no overflow
      # from 320 to 1440 px.
      - name: /live/ in a real browser, with no control plane
        run: npm run verify:live

  # The recorded evidence /live/ shows is only worth something if it still
  # describes the code. This starts the real API on real PostgreSQL and Redis,
  # captures all five demonstrations afresh, and compares them with the
  # committed recording by behaviour — statuses, outcomes, routes, the refusing
  # policy, the audit rows — never by timings or ids. A difference fails the
  # run; a deliberately tampered copy must fail too. The fresh capture is kept
  # as an artifact.
  recording:
    name: Recorded evidence conforms (real API, PostgreSQL, Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: cpadmin
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: control_plane
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cpadmin -d control_plane"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-bookworm
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # NODE_ENV is set only where the API starts: at job level it made `npm ci`
      # skip devDependencies, and the TypeScript build then had no types.
      API_HOST: 127.0.0.1
      API_PORT: '8080'
      LOG_LEVEL: warn
      DATABASE_ADMIN_URL: postgres://cpadmin:devpassword@127.0.0.1:5432/control_plane
      DATABASE_URL: postgres://demo_app:ciapppassword@127.0.0.1:5432/control_plane
      APP_DB_PASSWORD: ciapppassword
      REDIS_URL: redis://127.0.0.1:6379
      IP_HASH_PEPPER: ci-pepper-value-at-least-16-chars
      ADMIN_TOKEN: ci-admin-token-at-least-24-characters
      PAYMENT_WEBHOOK_SECRET: ci-webhook-secret-value
      RECEIPT_SIGNING_KEY: ci-receipt-signing-key-at-least-32-chars
      OTEL_ENABLED: 'false'
      CAPTURE_ENVIRONMENT: GitHub Actions — the API on real PostgreSQL 17 and Redis 7 service containers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build the control plane
        run: npm run build --workspace @portfolio/api

      - name: Migrate
        run: node services/api/dist/db/migrate.js

      - name: Start the API
        env:
          NODE_ENV: production
        run: |
          node services/api/dist/index.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/health/ready > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/api.log
          exit 1

      - name: Capture afresh and compare with the committed recording
        run: LIVE_API=http://127.0.0.1:8080 npm run verify:recording

      - name: Keep the fresh capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recording-conformance-${{ github.run_id }}
          path: build/recording-conformance.json
          if-no-files-found: warn

  # Enforcing as of P8. Scoped to the two pages blueprint §7.5 names — Home and
  # the flagship case study — for the reason recorded in lighthouserc.json: the
  # live surface is measured against the §11 experience budgets by the render
  # harness on a real GPU, not by a static-page performance score.
  lighthouse:
    name: Lighthouse (enforcing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun
