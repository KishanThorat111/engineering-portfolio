# CI truth gates — blueprint §7.5.
#
# Every push to main passes these gates before it can deploy. The gates encode
# the Truth Constitution rather than promising it: the copy gate greps BUILT
# output — the pages people read and the artifacts machines read — for banned
# identity and hype words (Ruling 1, §3.4), the link gate makes dead internal
# links a build failure, and the dependency audit applies the lesson this
# portfolio publishes: known CVEs must never reach main silently.
#
# The gates run at the repository root against the composed `dist/` that every
# workspace builds into, so they keep covering the whole deployed surface as
# surfaces are added rather than needing one copy per workspace.
#
# Lighthouse runs warn-only until Phase 8 hardening flips it to enforcing.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    name: Build & truth gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high

      # Formatting was verified by hand before every commit until now, which
      # means it was verified by memory. It is deterministic and cheap, so it
      # belongs here rather than in a habit.
      - name: Formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Copy gate — banned words against built HTML
        run: npm run gate:copy

      - name: Internal link check
        run: npm run gate:links

      - name: HTML validation
        run: npm run gate:html

      - name: Token contrast (WCAG 2.2 AA)
        run: npm run gate:contrast

      - name: Confidential-content parity against the CV
        run: npm run gate:confidential

      - name: Machine/human parity — profile.json against the pages
        run: npm run gate:machine

      # The two surfaces now share an origin, so the risk is the one rule 10
      # exists to catch: each telling a reader something different. This reads
      # the built artifact and needs no browser, so it belongs beside the other
      # truth gates rather than in the local-only render harness.
      - name: Fast lane and machine layer reconciled
        run: npm run gate:fastlane

  lighthouse:
    name: Lighthouse (warn-only until Phase 8)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun
